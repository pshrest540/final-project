services:
  - type: web
    name: finalproject-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DB_CONNECT_TIMEOUT
        value: 10
      - key: CREATE_DB_TABLES_ON_STARTUP
        value: false
      - key: LOAD_MODELS_ON_STARTUP
        value: false

  - type: web
    name: finalproject-streamlit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/Vehicle_Input.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_BASE
        sync: false
      - key: API_TIMEOUT
        value: 120
